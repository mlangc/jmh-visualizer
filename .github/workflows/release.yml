name: Create GitHub Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [ "$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $package_version"
            exit 1
          fi
      - run: npm ci
      - run: npm run providedZip
      - name: Check that the build shows the bare version
        run: |
          resolved=$(node -p "require('./version').resolve()")
          if [ "$resolved" != "$GITHUB_REF_NAME" ]; then
            echo "Resolved version $resolved doesn't match tag $GITHUB_REF_NAME"
            exit 1
          fi
      - run: gh release create "$GITHUB_REF_NAME" jmh-visualizer.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag --draft
        env:
          GH_TOKEN: ${{ github.token }}
